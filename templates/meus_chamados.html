<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meus Chamados - Sistema de Chamados</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="card card--wide">
        <h1>Meus Chamados</h1>

        {% if chamados %}
        <table class="tabela-responsiva">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Categoria</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for id, titulo, categoria, prioridade, status in chamados %}
                <tr>
                    <td data-label="ID">{{ id }}</td>
                    <td data-label="Título">{{ titulo }}</td>
                    <td data-label="Categoria">{{ categoria }}</td>
                    <td data-label="Prioridade">{{ prioridade }}</td>
                    <td data-label="Status">{{ status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p>Nenhum chamado encontrado.</p>
        {% endif %}

        <a class="voltar" href="{{ url_for('auth.painel') }}">Voltar ao painel</a>
    </div>
</body>
</html>
