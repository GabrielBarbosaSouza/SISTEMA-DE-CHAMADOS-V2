<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel - Sistema de Chamados</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Bem-vindo, {{ nome }}!</h1>
        <p>Perfil: <strong>{{ perfil }}</strong></p>

        <nav class="menu">
            {% if perfil == 'TI' %}
                <a href="{{ url_for('chamados.listar_chamados') }}">Ver lista de todos os chamados</a>
                <a href="{{ url_for('chamados.meus_chamados') }}">Ver os meus chamados</a>
                <a href="{{ url_for('chamados.abrir_chamado') }}">Abrir novo chamado</a>
                <a href="{{ url_for('usuarios.cadastrar_usuario') }}">Cadastrar novo usuário</a>
                <a href="{{ url_for('dashboard.dashboard') }}">Ver dashboard</a>
                <a href="{{ url_for('autenticacao.logout') }}">Sair</a>
            {% else %}
                <a href="{{ url_for('chamados.meus_chamados') }}">Ver os meus chamados</a>
                <a href="{{ url_for('chamados.abrir_chamado') }}">Abrir novo chamado</a>
                <a href="{{ url_for('autenticacao.logout') }}">Sair</a>
            {% endif %}
        </nav>
    </div>
</body>
</html>
