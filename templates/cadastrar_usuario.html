<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Usuário - Sistema de Chamados</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.3rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            margin-top: 1.5rem;
            padding: 0.6rem 1.2rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .erro {
            color: #dc2626;
            margin-top: 1rem;
        }

        a {
            color: #2563eb;
            display: block;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Cadastrar novo usuário</h1>

        {% if erro %}
        <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome">

            <label for="nome">Perfil do Usuário</label>
            <input type="text" id="perfil" name="perfil">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email">

            <label for="matricula">Matrícula (4 dígitos)</label>
            <input type="text" id="matricula" name="matricula" maxlength="4">

            <button type="submit">Cadastrar</button>
        </form>

        <a href="{{ url_for('painel') }}">Voltar ao painel</a>
    </div>
</body>
</html>
