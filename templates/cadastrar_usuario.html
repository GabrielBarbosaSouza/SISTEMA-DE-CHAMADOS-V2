<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Usuário - Sistema de Chamados</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Cadastrar novo usuário</h1>

        {% if erro %}
        <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome">

            <label for="perfil">Perfil do Usuário</label>
            <input type="text" id="perfil" name="perfil">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email">

            <label for="matricula">Matrícula (4 dígitos)</label>
            <input type="text" id="matricula" name="matricula" maxlength="4">

            <button type="submit">Cadastrar</button>
        </form>

        <a class="voltar" href="{{ url_for('auth.painel') }}">Voltar ao painel</a>
    </div>
</body>
</html>
