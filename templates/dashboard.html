<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Sistema de Chamados</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="card card--wide">
        <h1>Dashboard</h1>

        <div class="cards-resumo">
            <div class="card">
                <div class="numero">{{ tot_usuarios }}</div>
                <div class="rotulo">Total de usuários</div>
            </div>

            <div class="card">
                <div class="numero">{{ tot_chamados }}</div>
                <div class="rotulo">Total de chamados</div>
            </div>

            <div class="card">
                <div class="numero">{{ chamados_abertos }}</div>
                <div class="rotulo">Chamados abertos</div>
            </div>

            <div class="card">
                <div class="numero">{{ chamados_fechados }}</div>
                <div class="rotulo">Chamados fechados</div>
            </div>
        </div>

        <a class="voltar" href="{{ url_for('auth.painel') }}">Voltar ao painel</a>
    </div>
</body>
</html>
